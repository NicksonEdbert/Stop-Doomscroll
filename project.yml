# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# (or just run scripts/bootstrap.sh, which does that for you).
name: StopDoomscroll

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  DoomCore:
    path: Packages/DoomCore

targets:
  StopDoomscroll:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StopDoomscroll
    dependencies:
      - package: DoomCore
    # Bundle ID and team live in the xcconfig, so your personal values survive re-generating.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Stop Doomscroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - instagram
          - tiktok
          - snssdk1233
          - youtube
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme: {}
